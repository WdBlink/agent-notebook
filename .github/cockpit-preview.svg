<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">Daily Cockpit preview</title>
  <desc id="desc">An Obsidian cockpit showing yesterday agent sessions, local model todo decomposition, and selectable hot starts.</desc>
  <rect width="1280" height="720" fill="#f7faf8"/>
  <rect x="74" y="58" width="1132" height="604" rx="18" fill="#ffffff" stroke="#cfd8d4"/>
  <line x1="112" y1="176" x2="1168" y2="176" stroke="#d7e0dc"/>
  <text x="112" y="108" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#2f705f">Daily Cockpit</text>
  <text x="112" y="148" font-family="Arial, sans-serif" font-size="32" font-weight="700" fill="#17231f">昨日 agent 工作会话 + 今日热启动</text>

  <g font-family="Arial, sans-serif">
    <rect x="874" y="88" width="112" height="58" rx="8" fill="#f3f6f4" stroke="#d7e0dc"/>
    <text x="898" y="112" font-size="12" fill="#5e6b66">Sessions</text>
    <text x="898" y="138" font-size="22" font-weight="700" fill="#17231f">4</text>
    <rect x="1004" y="88" width="84" height="58" rx="8" fill="#f3f6f4" stroke="#d7e0dc"/>
    <text x="1024" y="112" font-size="12" fill="#5e6b66">Tasks</text>
    <text x="1024" y="138" font-size="22" font-weight="700" fill="#17231f">7</text>
    <rect x="1106" y="88" width="62" height="58" rx="8" fill="#f3f6f4" stroke="#d7e0dc"/>
    <text x="1124" y="112" font-size="12" fill="#5e6b66">Hot</text>
    <text x="1124" y="138" font-size="22" font-weight="700" fill="#17231f">3</text>
  </g>

  <g font-family="Arial, sans-serif">
    <text x="112" y="222" font-size="22" font-weight="700" fill="#17231f">昨日工作会话</text>
    <text x="726" y="222" font-size="13" fill="#5e6b66">2026-07-02 · 4 条</text>
    <rect x="812" y="198" width="58" height="30" rx="6" fill="#ffffff" stroke="#cfd8d4"/>
    <text x="829" y="218" font-size="12" font-weight="700" fill="#2f705f">刷新</text>
    <line x1="112" y1="242" x2="870" y2="242" stroke="#d7e0dc"/>

    <g>
      <rect x="112" y="266" width="72" height="24" rx="6" fill="#eef5f2" stroke="#b5ccc3"/>
      <text x="130" y="283" font-size="12" font-weight="700" fill="#2f705f">Codex</text>
      <text x="198" y="284" font-size="17" font-weight="700" fill="#17231f">实现每日看板热启动原型</text>
      <text x="198" y="310" font-size="13" fill="#5e6b66">扫描器、会话区 UI、Markdown 导出已经接上。</text>
      <text x="198" y="333" font-size="12" fill="#5e6b66">resume: codex resume 019f...</text>
    </g>

    <g>
      <rect x="112" y="362" width="72" height="24" rx="6" fill="#eef5f2" stroke="#b5ccc3"/>
      <text x="128" y="379" font-size="12" font-weight="700" fill="#2f705f">Claude</text>
      <text x="198" y="380" font-size="17" font-weight="700" fill="#17231f">补齐原始 idea 的产品语义</text>
      <text x="198" y="406" font-size="13" fill="#5e6b66">先看昨天 agent 做了什么，再决定今天哪些任务热启动。</text>
    </g>
  </g>

  <g font-family="Arial, sans-serif">
    <text x="924" y="222" font-size="22" font-weight="700" fill="#17231f">热启动</text>
    <text x="1104" y="222" font-size="13" fill="#5e6b66">3 条</text>
    <line x1="924" y1="242" x2="1168" y2="242" stroke="#d7e0dc"/>
    <text x="924" y="282" font-size="17" font-weight="700" fill="#17231f">梳理项目核心概念</text>
    <text x="924" y="310" font-size="13" fill="#5e6b66">提前读取项目文档并生成概念表。</text>
    <line x1="924" y1="336" x2="1168" y2="336" stroke="#d7e0dc"/>
    <text x="924" y="376" font-size="17" font-weight="700" fill="#17231f">准备运行 demo</text>
    <text x="924" y="404" font-size="13" fill="#5e6b66">记录启动命令和失败日志。</text>
  </g>

  <g font-family="Arial, sans-serif">
    <rect x="112" y="456" width="1056" height="78" rx="10" fill="#f3f6f4" stroke="#d7e0dc"/>
    <text x="140" y="484" font-size="14" font-weight="700" fill="#5e6b66">说一下你今天想推进什么</text>
    <text x="140" y="513" font-size="19" fill="#17231f">今天继续做每日看板，把昨天 agent 已经干过的工作整理成可恢复的热启动入口。</text>
    <rect x="1014" y="484" width="112" height="36" rx="7" fill="#3f7e6b"/>
    <text x="1043" y="507" font-size="14" font-weight="700" fill="#ffffff">拆成待办</text>

    <text x="112" y="584" font-size="22" font-weight="700" fill="#17231f">待办候选</text>
    <line x1="112" y1="604" x2="870" y2="604" stroke="#d7e0dc"/>
    <rect x="112" y="628" width="18" height="18" rx="3" fill="#3f7e6b"/>
    <path d="M117 637l4 4 8-9" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="148" y="640" font-size="17" font-weight="700" fill="#17231f">把 Codex / Claude 会话映射到今日待办</text>
    <text x="148" y="666" font-size="13" fill="#5e6b66">P0 · 实现 · 保留 session id、path 和 resume 命令。</text>
  </g>
</svg>
