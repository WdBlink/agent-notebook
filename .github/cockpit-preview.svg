<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">Daily Cockpit preview</title>
  <desc id="desc">An Obsidian hot-start planner that turns one natural-language intent into selectable AI-prep todos.</desc>
  <rect width="1280" height="720" fill="#f8faf9"/>
  <rect x="76" y="64" width="1128" height="592" rx="18" fill="#ffffff" stroke="#cfd8d4"/>
  <line x1="112" y1="184" x2="1168" y2="184" stroke="#d7e0dc"/>
  <text x="112" y="116" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#2f705f">Daily Cockpit</text>
  <text x="112" y="154" font-family="Arial, sans-serif" font-size="34" font-weight="700" fill="#17231f">把一句话拆成明天可启动的待办</text>
  <g font-family="Arial, sans-serif">
    <rect x="904" y="94" width="96" height="58" rx="8" fill="#f3f6f4" stroke="#d7e0dc"/>
    <text x="926" y="118" font-size="12" fill="#5e6b66">Plans</text>
    <text x="926" y="143" font-size="22" font-weight="700" fill="#17231f">3</text>
    <rect x="1018" y="94" width="96" height="58" rx="8" fill="#f3f6f4" stroke="#d7e0dc"/>
    <text x="1040" y="118" font-size="12" fill="#5e6b66">Tasks</text>
    <text x="1040" y="143" font-size="22" font-weight="700" fill="#17231f">7</text>
    <rect x="112" y="216" width="1056" height="136" rx="10" fill="#f3f6f4" stroke="#d7e0dc"/>
    <text x="140" y="252" font-size="14" font-weight="700" fill="#5e6b66">说一下你想推进什么</text>
    <text x="140" y="291" font-size="22" fill="#17231f">明天我想研究一个项目，先弄清楚核心概念、论文和代码结构，如果可以就先跑一个 demo。</text>
    <rect x="994" y="297" width="126" height="38" rx="7" fill="#3f7e6b"/>
    <text x="1025" y="322" font-size="15" font-weight="700" fill="#ffffff">拆成待办</text>
  </g>
  <g font-family="Arial, sans-serif">
    <text x="112" y="408" font-size="24" font-weight="700" fill="#17231f">待办候选</text>
    <text x="1010" y="408" font-size="24" font-weight="700" fill="#17231f">热启动</text>
    <line x1="112" y1="430" x2="876" y2="430" stroke="#d7e0dc"/>
    <line x1="960" y1="430" x2="1168" y2="430" stroke="#d7e0dc"/>
    <g>
      <rect x="112" y="456" width="18" height="18" rx="3" fill="#3f7e6b"/>
      <path d="M117 465l4 4 8-9" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="148" y="465" font-size="18" font-weight="700" fill="#17231f">梳理项目核心概念</text>
      <text x="148" y="493" font-size="14" fill="#5e6b66">P0 · 调研 · 读 README、论文和 docs，列出关键术语。</text>
      <rect x="148" y="514" width="678" height="46" rx="6" fill="#eef5f2"/>
      <text x="166" y="542" font-size="14" fill="#2f705f">热启动建议：提前读取项目文档并生成概念表。</text>
    </g>
    <g>
      <rect x="112" y="590" width="18" height="18" rx="3" fill="#ffffff" stroke="#9aa8a2"/>
      <text x="148" y="600" font-size="18" font-weight="700" fill="#17231f">尝试跑 demo</text>
      <text x="148" y="628" font-size="14" fill="#5e6b66">P1 · 实现 · 安装依赖，记录能否启动和失败原因。</text>
    </g>
    <g>
      <text x="960" y="466" font-size="18" font-weight="700" fill="#17231f">梳理项目核心概念</text>
      <text x="960" y="494" font-size="14" fill="#5e6b66">提前读取项目文档并生成概念表。</text>
      <line x1="960" y1="526" x2="1168" y2="526" stroke="#d7e0dc"/>
    </g>
  </g>
</svg>
