<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">Daily Cockpit preview</title>
  <desc id="desc">A Chinese-first Obsidian cockpit with capture, today, now, inbox, and held ideas.</desc>
  <rect width="1280" height="720" fill="#f7f5ef"/>
  <rect x="42" y="42" width="214" height="636" rx="18" fill="#ffffff" stroke="#d8d2c7"/>
  <rect x="82" y="82" width="52" height="52" rx="12" fill="#e7f0eb" stroke="#9fbfaf"/>
  <text x="97" y="114" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#245a4a">DC</text>
  <text x="82" y="168" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#1e2428">每日启动台</text>
  <text x="82" y="194" font-family="Arial, sans-serif" font-size="13" fill="#667173">外部工作记忆</text>
  <g font-family="Arial, sans-serif" font-size="15" fill="#1e2428">
    <rect x="70" y="236" width="158" height="46" rx="8" fill="#e7f0eb" stroke="#9fbfaf"/>
    <text x="92" y="264">今天</text>
    <text x="92" y="322">正在做</text>
    <text x="92" y="374">灵感收纳箱</text>
    <text x="92" y="426">近期看看</text>
    <text x="92" y="478">先替我记着</text>
    <text x="92" y="530">归档</text>
  </g>
  <rect x="290" y="42" width="948" height="148" rx="18" fill="#ffffff" stroke="#d8d2c7"/>
  <text x="326" y="86" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#245a4a">接住灵感，不丢。守住今天，不乱。</text>
  <text x="326" y="132" font-family="Arial, sans-serif" font-size="34" font-weight="700" fill="#1e2428">早上 3 分钟，接上昨天的自己</text>
  <rect x="912" y="74" width="96" height="78" rx="12" fill="#f1efe8" stroke="#d8d2c7"/>
  <text x="936" y="104" font-family="Arial, sans-serif" font-size="12" fill="#667173">Today</text>
  <text x="936" y="136" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#1e2428">3/5</text>
  <rect x="1024" y="74" width="96" height="78" rx="12" fill="#f1efe8" stroke="#d8d2c7"/>
  <text x="1052" y="104" font-family="Arial, sans-serif" font-size="12" fill="#667173">Now</text>
  <text x="1052" y="136" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#1e2428">1/1</text>
  <rect x="290" y="214" width="948" height="94" rx="18" fill="#ffffff" stroke="#d8d2c7"/>
  <text x="326" y="248" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#667173">随手捕捉</text>
  <rect x="326" y="262" width="650" height="1" fill="#d8d2c7"/>
  <text x="326" y="290" font-family="Arial, sans-serif" font-size="18" fill="#667173">把闪过的想法先放这里，今天不一定要处理。</text>
  <rect x="1010" y="248" width="174" height="44" rx="8" fill="#3f7e6b"/>
  <text x="1048" y="276" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#ffffff">先替我记着</text>
  <rect x="290" y="332" width="600" height="284" rx="18" fill="#ffffff" stroke="#d8d2c7"/>
  <text x="326" y="374" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#1e2428">今天</text>
  <g font-family="Arial, sans-serif">
    <rect x="326" y="402" width="528" height="70" rx="10" fill="#f7f5ef" stroke="#d8d2c7"/>
    <text x="350" y="430" font-size="18" font-weight="700" fill="#1e2428">早上 3 分钟接上昨天的自己</text>
    <text x="350" y="456" font-size="14" fill="#667173">把昨天散落的进展先收拢，不急着开新坑。</text>
    <rect x="326" y="492" width="528" height="70" rx="10" fill="#f7f5ef" stroke="#d8d2c7"/>
    <text x="350" y="520" font-size="18" font-weight="700" fill="#1e2428">完成 README 第一屏</text>
    <text x="350" y="546" font-size="14" fill="#667173">让陌生人 10 秒内理解本地优先的工作记忆。</text>
  </g>
  <rect x="916" y="332" width="322" height="284" rx="18" fill="#ffffff" stroke="#d8d2c7"/>
  <text x="952" y="374" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#1e2428">先替我记着</text>
  <text x="952" y="414" font-family="Arial, sans-serif" font-size="16" fill="#667173">这些想法安全地放在这里，今天不用管。</text>
  <rect x="952" y="456" width="220" height="54" rx="10" fill="#f7f5ef" stroke="#d8d2c7"/>
  <text x="974" y="489" font-family="Arial, sans-serif" font-size="15" fill="#1e2428">想到一个语音捕捉入口</text>
</svg>
