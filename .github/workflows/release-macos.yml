name: Release macOS

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing v-prefixed tag to publish
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Assert native runner architecture
        run: test "$(node -p process.arch)" = "${{ matrix.arch }}"
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run test:e2e
      - run: npm run dist:macos:arch -- --${{ matrix.arch }}
      - name: Create checksums
        run: |
          cd dist/macos
          for FILE in *-macos-${{ matrix.arch }}.dmg *-macos-${{ matrix.arch }}.zip; do
            shasum -a 256 "$FILE" > "$FILE.sha256"
          done
      - name: Verify desktop installers
        run: |
          VERSION="$(node -p 'require("./package.json").version')"
          for FORMAT in dmg zip; do
            npm run verify:desktop-release -- --archive "dist/macos/Work Continuity-${VERSION}-macos-${{ matrix.arch }}.${FORMAT}" --arch "${{ matrix.arch }}"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.arch }}
          path: |
            dist/macos/*.dmg
            dist/macos/*.zip
            dist/macos/*.sha256
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/download-artifact@v4
        with:
          pattern: macos-*
          path: dist/upload
          merge-multiple: true
      - name: Assemble checksums
        run: cat dist/upload/*.sha256 | sort > dist/upload/SHA256SUMS.txt
      - name: Validate release tag
        run: |
          VERSION="$(node -p 'require("./package.json").version')"
          test "$RELEASE_TAG" = "v${VERSION}"
      - name: Create or update release
        run: |
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" dist/upload/*.dmg dist/upload/*.zip dist/upload/SHA256SUMS.txt --clobber --repo "$GITHUB_REPOSITORY"
            gh release edit "$RELEASE_TAG" --notes-file RELEASE_NOTES.md --title "Work Continuity $RELEASE_TAG" --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$RELEASE_TAG" dist/upload/*.dmg dist/upload/*.zip dist/upload/SHA256SUMS.txt --verify-tag --title "Work Continuity $RELEASE_TAG" --notes-file RELEASE_NOTES.md --repo "$GITHUB_REPOSITORY"
          fi
